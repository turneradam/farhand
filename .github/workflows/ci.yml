name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=warning arena/arena.sh launch/launch.sh tests/*.sh
      - name: tests
        run: |
          bash tests/test_arena.sh
          bash tests/test_launch.sh
